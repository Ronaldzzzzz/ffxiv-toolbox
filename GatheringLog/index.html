<!DOCTYPE html>
<html lang="zh-TW" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFXIV Gathering Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Custom Thin Scrollbar */
        .thin-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .thin-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .thin-scrollbar::-webkit-scrollbar-thumb {
            background-color: #cbd5e1; /* slate-300 */
            border-radius: 20px;
        }
        .dark .thin-scrollbar::-webkit-scrollbar-thumb {
            background-color: #475569; /* slate-600 */
        }

        .checked-item {
            opacity: 0.5;
            filter: grayscale(100%);
            transition: all 0.3s;
        }

        .checked-item .item-name {
            text-decoration: line-through;
            opacity: 0.7;
        }

        html {
            scroll-behavior: smooth;
        }

        .custom-checkbox {
            appearance: none;
            background-color: transparent;
            border: 2px solid currentColor;
            border-radius: 4px;
            display: grid;
            place-content: center;
        }

        .custom-checkbox::before {
            content: "";
            width: 10px;
            height: 10px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #3b82f6;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        .custom-checkbox:checked {
            border-color: #3b82f6;
        }

        :root {
            --header-offset: 0px;
        }

        /* Sticky Header Offset */
        .section-header-sticky {
            position: sticky;
            top: var(--header-offset);
            z-index: 20;
            transition: top 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: top;
        }

        /* Temp Disable Sticky during layout animation */
        .no-sticky .section-header-sticky {
            position: relative !important;
            top: auto !important;
            transition: none !important;
        }

        /* --- STICKY PINNED STATE --- */
        .is-pinned {
            border-top-color: transparent !important;
            border-top-left-radius: 0 !important;
            border-top-right-radius: 0 !important;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1) !important;
            padding-top: 0.5rem !important; 
            padding-bottom: 0.25rem !important; /* Tight bottom padding */
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); /* Smooth transition for container */
        }

        /* Smooth Collapse with Grid */
        #collapsible-header {
            display: grid;
            grid-template-rows: 1fr;
            transition: grid-template-rows 0.5s cubic-bezier(0.4, 0, 0.2, 1), 
                        opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 1;
            will-change: grid-template-rows, opacity;
        }

        /* Collapsed State */
        .is-pinned #collapsible-header {
            grid-template-rows: 0fr !important;
            opacity: 0 !important;
        }
        
        .collapsible-inner {
            overflow: hidden;
            min-height: 0; /* Important for grid responsiveness */
        }

        /* Switch to Horizontal Scroll when Pinned */
        .is-pinned #level-grid {
            display: flex !important;
            flex-wrap: nowrap !important;
            overflow-x: auto !important;
            gap: 0.5rem !important;
            padding-bottom: 8px; /* Space for scrollbar */
            cursor: grab; /* Drag cursor hint */
        }
        
        .is-pinned #level-grid:active {
            cursor: grabbing;
        }

        /* Visible Scrollbar for Horizontal Mode */
        .is-pinned #level-grid::-webkit-scrollbar {
            display: block;
            height: 6px;
        }
        
        .is-pinned #level-grid::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .is-pinned #level-grid::-webkit-scrollbar-thumb {
            background-color: #cbd5e1; /* slate-300 */
            border-radius: 10px;
        }
        
        .dark .is-pinned #level-grid::-webkit-scrollbar-thumb {
            background-color: #475569; /* slate-600 */
        }

        .is-pinned #level-grid > button {
            flex: 0 0 auto !important;
            min-width: 80px !important;
            padding: 0.25rem 0.5rem !important;
        }
        
        /* Default Grid (un-pinned) */
        #level-grid {
            display: flex;
            flex-wrap: wrap; /* Default: Wrap */
            gap: 0.5rem;
            contain: layout; /* Isolate layout */
        }
        
        #level-grid > button {
            contain: layout style; /* Optimize button rendering */
            content-visibility: auto; /* Browser optimization */
        }

        /* Hide the folklore break div when pinned */
        .is-pinned #level-grid > div.basis-full {
             display: none !important;
        }

        /* Show pinned job label when pinned */
        .is-pinned #pinned-job-label {
            display: flex !important;
            animation: fadeIn 0.3s ease-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        body {
            transition: background-color 0.3s, color 0.3s;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen font-sans pb-20">

                        <label class="inline-flex items-center cursor-pointer ml-3 gap-2 group">

                        </label>
                        <label class="inline-flex items-center cursor-pointer ml-3 gap-2 group">
                            <input type="checkbox" id="show-bookmarks-check" class="sr-only peer" onchange="toggleShowBookmarks()">

                            <span id="ui-show-bookmarks" class="text-xs font-medium text-slate-600 dark:text-slate-400 group-hover:text-slate-900 dark:group-hover:text-slate-200 transition-colors">⭐ Bookmarks</span>
                        </label>
                    </div>
                </div>

                <!-- View Mode Buttons (Centered) -->
                <div id="view-mode-buttons" class="flex items-center bg-slate-200 dark:bg-slate-700 p-1 rounded-lg w-full md:w-auto md:absolute md:left-1/2 md:-translate-x-1/2 mt-4 md:mt-0">
                    <button id="view-mode-level" onclick="switchToLevelView()"

                    <button id="view-mode-timed" onclick="switchToTimedView()"

                <div class="flex gap-3 items-center ml-auto">

                        <button onclick="changeLang('en')" id="lang-en"

                        <button onclick="changeLang('ja')" id="lang-ja"

                    <button id="theme-toggle" onclick="toggleTheme()"

    <div class="max-w-[1600px] mx-auto p-4 flex flex-col md:flex-row gap-6 items-start">
