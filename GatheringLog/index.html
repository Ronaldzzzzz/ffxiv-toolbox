<!DOCTYPE html>
<html lang="zh-TW" class="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFXIV Gathering Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        .checked-item {
            opacity: 0.5;
            filter: grayscale(100%);
            transition: all 0.3s;
        }

        .checked-item .item-name {
            text-decoration: line-through;
            opacity: 0.7;
        }

        html {
            scroll-behavior: smooth;
        }

        .custom-checkbox {
            appearance: none;
            background-color: transparent;
            border: 2px solid currentColor;
            border-radius: 4px;
            display: grid;
            place-content: center;
        }

        .custom-checkbox::before {
            content: "";
            width: 10px;
            height: 10px;
            transform: scale(0);
            transition: 120ms transform ease-in-out;
            box-shadow: inset 1em 1em #3b82f6;
            transform-origin: center;
            clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);
        }

        .custom-checkbox:checked::before {
            transform: scale(1);
        }

        .custom-checkbox:checked {
            border-color: #3b82f6;
        }

        :root {
            --header-offset: 0px;
        }

        /* Sticky Header Offset */
        .section-header-sticky {
            position: sticky;
            top: var(--header-offset);
            z-index: 20;
        }

        /* --- STICKY PINNED STATE --- */
        .is-pinned {
            border-top-color: transparent !important;
            border-top-left-radius: 0 !important;
            border-top-right-radius: 0 !important;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1) !important;
            padding-top: 0.5rem !important; 
            padding-bottom: 0.25rem !important; /* Tight bottom padding */
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); /* Smooth transition for container */
        }

        /* Smooth Collapse for Main Controls */
        #main-controls, #ui-jump-to {
            max-height: 150px; /* Approximate max height */
            opacity: 1;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.4, 0, 0.2, 1), 
                        opacity 0.3s ease-out,
                        margin 0.4s ease;
        }

        /* Hide Top Controls when pinned (Animated) */
        .is-pinned #main-controls, 
        .is-pinned #ui-jump-to {
            max-height: 0 !important;
            opacity: 0 !important;
            margin-top: 0 !important;
            margin-bottom: 0 !important;
            pointer-events: none; /* Prevent clicks while hiding */
            display: block !important; /* Ensure default is block for animation to work, override earlier none if any */
        }

        /* Switch to Horizontal Scroll when Pinned */
        .is-pinned #level-grid {
            display: flex !important;
            flex-wrap: nowrap !important;
            overflow-x: auto !important;
            gap: 0.5rem !important;
            padding-bottom: 8px; /* Space for scrollbar */
            cursor: grab; /* Drag cursor hint */
        }
        
        .is-pinned #level-grid:active {
            cursor: grabbing;
        }

        /* Visible Scrollbar for Horizontal Mode */
        .is-pinned #level-grid::-webkit-scrollbar {
            display: block;
            height: 6px;
        }
        
        .is-pinned #level-grid::-webkit-scrollbar-track {
            background: transparent;
        }
        
        .is-pinned #level-grid::-webkit-scrollbar-thumb {
            background-color: #cbd5e1; /* slate-300 */
            border-radius: 10px;
        }
        
        .dark .is-pinned #level-grid::-webkit-scrollbar-thumb {
            background-color: #475569; /* slate-600 */
        }

        .is-pinned #level-grid > button {
            flex: 0 0 auto !important;
            min-width: 80px !important;
            padding: 0.25rem 0.5rem !important;
        }
        
        /* Default Grid (un-pinned) */
        #level-grid {
            display: flex;
            flex-wrap: wrap; /* Default: Wrap */
            gap: 0.5rem;
        }

        /* Hide the folklore break div when pinned */
        .is-pinned #level-grid > div.basis-full {
             display: none !important;
        }

        body {
            transition: background-color 0.3s, color 0.3s;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-100 min-h-screen font-sans pb-20">

    <nav id="main-nav"
        class="sticky top-0 z-50 bg-white/95 dark:bg-slate-800/95 backdrop-blur-md shadow-md border-b border-slate-200 dark:border-slate-700 transition-all">
        <div class="max-w-[1600px] mx-auto px-4 py-3">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <div class="flex items-center gap-2">
                        <h1 id="ui-title"
                            class="text-xl font-bold text-slate-800 dark:text-yellow-500 flex items-center gap-2">FFXIV
                            Gathering Guide</h1>
                        <span
                            class="text-xs px-2 py-0.5 rounded bg-blue-100 dark:bg-blue-900 text-blue-600 dark:text-blue-300 ml-2 border border-blue-200 dark:border-blue-700">
                            V2.1</span>
                    </div>
                    <div class="flex items-center gap-2 mt-1">
                        <div class="text-xs font-mono text-blue-600 dark:text-blue-300">
                            <span id="ui-progress">Progress</span>: <span id="progress-text">0/0</span>
                        </div>
                        <span class="text-slate-400 dark:text-slate-600">|</span>
                        <div id="et-clock" class="text-xs font-mono font-bold text-slate-700 dark:text-slate-300 min-w-[60px]">
                            ET 00:00
                        </div>
                        <span class="text-slate-400 dark:text-slate-600 ml-1">|</span>
                        <label class="inline-flex items-center cursor-pointer ml-3 gap-2 group">
                            <input type="checkbox" id="hide-completed-check" class="sr-only peer" onchange="toggleHideCompleted()">
                            <div class="relative w-9 h-5 bg-slate-200 peer-focus:outline-none peer-focus:ring-2 peer-focus:ring-blue-300 dark:peer-focus:ring-blue-800 rounded-full peer dark:bg-slate-700 peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all dark:border-gray-600 peer-checked:bg-blue-600"></div>
                            <span id="ui-hide-completed" class="text-xs font-medium text-slate-600 dark:text-slate-400 group-hover:text-slate-900 dark:group-hover:text-slate-200 transition-colors">Hide Completed</span>
                        </label>
                    </div>
                </div>

                <div class="flex gap-3 items-center ml-auto">
                    <a href="../index.html"
                        class="text-sm text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white transition-colors flex items-center gap-1">
                        <span data-i18n="nav_home">回首頁</span>
                    </a>
                    <div
                        class="flex space-x-1 bg-slate-100 dark:bg-slate-900 p-0.5 rounded border border-slate-300 dark:border-slate-700">
                        <button onclick="changeLang('zh-TW')" id="lang-tw"
                            class="px-2 py-0.5 text-xs rounded opacity-50">繁</button>
                        <button onclick="changeLang('zh-CN')" id="lang-cn"
                            class="px-2 py-0.5 text-xs rounded opacity-50">简</button>
                        <button onclick="changeLang('en')" id="lang-en"
                            class="px-2 py-0.5 text-xs rounded opacity-50">EN</button>
                        <button onclick="changeLang('ja')" id="lang-ja"
                            class="px-2 py-0.5 text-xs rounded opacity-50">日</button>
                    </div>
                    <button id="theme-toggle" onclick="toggleTheme()"
                        class="border border-slate-300 dark:border-slate-600 text-slate-500 dark:text-slate-400 p-2 rounded-lg hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                        🌙
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-[1600px] mx-auto p-4 flex flex-col md:flex-row gap-6 items-start">

        <aside id="region-sidebar"
            class="w-full md:w-56 shrink-0 bg-white dark:bg-slate-800 rounded-lg p-4 border border-slate-200 dark:border-slate-700 sticky top-24 max-h-[85vh] overflow-y-auto no-scrollbar shadow-lg z-40 transition-colors hidden">
            <h3 id="ui-region-title"
                class="text-slate-800 dark:text-yellow-500 font-bold mb-3 uppercase text-xs tracking-wider border-b border-slate-200 dark:border-slate-700 pb-2">
                Regions</h3>
            <div id="region-list" class="space-y-1"></div>
        </aside>

        <main id="content-area" class="flex-grow w-full min-w-0 relative">

            <div id="sticky-sentinel" class="absolute -top-[1px] w-full h-[1px]"></div>
            <div id="level-nav-container"
                class="sticky z-30 mb-4 bg-slate-50/95 dark:bg-slate-900/95 backdrop-blur-md p-3 rounded-lg border border-slate-200 dark:border-slate-700 shadow-md transition-all"
                style="top: var(--nav-height, 0px);">

                <!-- Main Controls -->
                <div id="main-controls" class="mb-6 flex flex-col items-start gap-4 w-full">
                    <!-- Type Switcher (Chips) -->
                    <div id="type-buttons" class="flex flex-wrap justify-start gap-3 mt-2 p-1 pl-2">
                        <!-- Buttons will be generated by JS -->
                    </div>
                </div>
                <div class="flex justify-between items-center mb-2">
                    <h3 id="ui-jump-to"
                        class="text-slate-500 dark:text-slate-400 text-xs font-bold uppercase tracking-wider">Jump To
                        Level</h3>
                </div>
                <div id="level-grid" class="flex flex-wrap gap-2"></div>
            </div>

            <div id="list-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 items-start">
                <div id="ui-loading" class="col-span-full text-center mt-10 text-slate-500">Loading data...</div>
            </div>

        </main>
    </div>

    <button onclick="window.scrollTo(0,0)"
        class="fixed bottom-6 right-6 bg-blue-600 text-white p-3 rounded-full shadow-lg opacity-80 hover:opacity-100 transition-opacity z-50">
        ⬆
    </button>

    <footer
        class="mt-8 py-6 border-t border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 text-center text-slate-500 dark:text-slate-600 text-[10px] md:text-xs leading-relaxed transition-colors">
        <p>FINAL FANTASY XIV © 2010 - 2026 SQUARE ENIX CO., LTD. 版權所有。</p>
        <p>FINAL FANTASY is a registered trademark of Square Enix Holdings Co., Ltd.</p>
        <p class="mt-2 text-[10px]">
            <span>參考資料來源:</span>

            <a href="https://cafemaker.wakingsands.com/" target="_blank" rel="noopener noreferrer"

    <script src="app.js"></script>
    </body>

</html>
